<h2>Mis cursos</h2>

<div *ngIf="cargando">Cargando...</div>

<div *ngIf="!cargando && cursos.length === 0">
  No tienes cursos vinculados.
</div>

<div class="lista-cursos" *ngIf="!cargando && cursos.length > 0">
  <div class="curso-card" *ngFor="let c of cursos">
    <h3>{{ c?.nombre || c?.id || $any(c)?._id || 'Curso' }}</h3>
    <button (click)="entrar(c)">Ingresar</button>
  </div>
</div>
